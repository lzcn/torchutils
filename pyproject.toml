[tool.ruff]
target-version = "py38"
line-length = 120
fix = true
show-fixes = true

exclude = [
  "build",
  "dist",
  ".eggs",
  ".mypy_cache",
  ".pytest_cache",
  "__pycache__",
  ".ruff_cache",
  ".venv",
  "venv",
  "env",
  "ENV",
  ".env",
]

[tool.ruff.lint]
preview = true
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "F841", "E402", "B904", "B006", "UP008"]

[tool.ruff.lint.isort]
  known-first-party = ["torchutils"]
  combine-as-imports = true
  force-sort-within-sections = true
