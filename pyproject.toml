[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torchutils"
dynamic = ["version"]
description = "A bunch of personal utilities for PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zhi Lu", email = "zhilu@uestc.edu.cn" }]
requires-python = ">=3.10"
dependencies = ["torch"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/lzcn/torchutils"

[tool.setuptools]
packages = ["torchutils"]

[tool.setuptools.package-data]
torchutils = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "torchutils.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true
show-fixes = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["torchutils"]
combine-as-imports = true
force-sort-within-sections = true
